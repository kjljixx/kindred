<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>kindred — reorder folders mockup</title>
<style>
:root {
  --space-1: 2px; --space-2: 4px; --space-3: 6px; --space-4: 8px; --space-5: 12px; --space-6: 16px; --space-7: 24px; --space-8: 32px;
  --font-size-1: 14px; --font-size-2: 16px; --font-size-3: 18px;
  --radius-1: 2px; --radius-2: 4px; --radius-3: 8px;
  --neutral-950: hsl(240,10%,4%); --neutral-925: hsl(240,8%,7%); --neutral-900: hsl(240,6%,10%);
  --neutral-800: hsl(240,5%,16%); --neutral-750: hsl(240,5%,20%); --neutral-700: hsl(240,5%,26%);
  --neutral-600: hsl(240,4%,34%); --neutral-500: hsl(240,4%,46%); --neutral-400: hsl(240,5%,65%);
  --neutral-200: hsl(240,6%,90%); --neutral-50: hsl(0,0%,98%);
  --primary-300: hsl(213,97%,78%); --primary-600: hsl(218,83%,53%);
  --accent-danger-300: hsl(0,93%,82%);
  --color-bg: var(--neutral-900); --color-bg-inset: var(--neutral-925); --color-bg-raised: var(--neutral-800);
  --color-border-strong: var(--neutral-700);
  --color-text: var(--neutral-200); --color-text-bright: var(--neutral-50); --color-text-muted: var(--neutral-400);
  --color-text-subtle: var(--neutral-500); --color-text-faint: var(--neutral-600);
  --color-accent: var(--primary-600);
  --font-ui: Geist, ui-sans-serif, system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; padding: var(--space-7); background: var(--neutral-950); color: var(--color-text); font-family: var(--font-ui); }
h1 { font-size: 22px; margin: 0 0 var(--space-2); color: var(--color-text-bright); }
.lede { color: var(--color-text-muted); margin: 0 0 var(--space-7); font-size: var(--font-size-1); max-width: 80ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(520px, 1fr)); gap: var(--space-7); align-items: start; }
figure { margin: 0; }
figcaption { margin-bottom: var(--space-4); font-size: var(--font-size-1); color: var(--color-text-muted); }
figcaption b { color: var(--color-text-bright); font-size: var(--font-size-2); margin-right: var(--space-4); }
.step { display: inline-block; min-width: 22px; text-align: center; padding: 1px var(--space-4); border-radius: var(--radius-3); font-size: 12px; font-weight: 700; background: hsla(217,91%,60%,.22); color: var(--primary-300); margin-right: var(--space-4); }

/* ---- app frame ---- */
.app { display: grid; grid-template-columns: 38% 1fr; height: 520px; border: 1px solid var(--color-border-strong); border-radius: var(--radius-3); overflow: hidden; background: var(--color-bg); }
.pane { display: flex; flex-direction: column; min-width: 0; position: relative; }
.pane + .pane { border-left: 1px solid var(--color-border-strong); }
.pane-header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-5); height: 48px; padding: 0 var(--space-5); flex: none; }
.brand, .pane-title { font-weight: 700; font-size: var(--font-size-3); color: var(--color-text-bright); }
.btn-tertiary { background: transparent; border: none; color: var(--color-text-muted); font: inherit; font-size: var(--font-size-2); font-weight: 700; padding: var(--space-1) var(--space-2); cursor: pointer; }
.editor-ph { padding: var(--space-5); color: var(--color-text-faint); font-size: var(--font-size-1); }
.mode-row { display: flex; align-items: flex-end; justify-content: space-between; padding: 0 var(--space-5); flex: none; }
.tabs { display: flex; gap: var(--space-4); }
.tab { padding: var(--space-3) var(--space-5); font-size: var(--font-size-3); font-weight: 600; color: var(--color-text-muted); border-radius: var(--radius-1) var(--radius-1) 0 0; }
.tab.active { background: var(--neutral-700); color: var(--color-text-bright); box-shadow: inset 0 -2px 0 var(--color-accent); }

/* ---- draft list (existing styles) ---- */
.draft-list { flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: var(--space-2); margin-top: var(--space-1); position: relative; }
.draft-item { display: flex; align-items: flex-start; gap: var(--space-4); padding: var(--space-4) var(--space-5); margin: 0 var(--space-3) var(--space-1); border-radius: var(--radius-2); }
.draft-item-body { flex: 1; min-width: 0; }
.draft-item-title { display: block; font-size: var(--font-size-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.draft-item-meta { display: block; margin-top: var(--space-1); color: var(--color-text-subtle); font-size: var(--font-size-1); }
.draft-item-actions { display: flex; gap: var(--space-2); visibility: hidden; align-items: center; }
.hover > .draft-item-actions { visibility: visible; }
.draft-item-action { background: transparent; border: none; color: var(--color-text-muted); font: inherit; font-size: var(--font-size-1); font-weight: 700; padding: 2px var(--space-2); line-height: 1.5; }
.draft-item-action.danger { font-size: 16px; }
.folder-item { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-4) var(--space-5); margin: 0 var(--space-3) var(--space-1); border-radius: var(--radius-2); }
.folder-item.hover { background: var(--color-bg-raised); }
.folder-chevron { width: 10px; height: 10px; flex: none; color: var(--color-text-subtle); transform: rotate(-90deg); }
.folder-item.open > .folder-chevron { transform: rotate(0); }
.folder-name { flex: 1; min-width: 0; font-size: var(--font-size-2); font-weight: 600; color: var(--color-text-bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.folder-children { margin-left: 18px; }
.folder-add { margin: 0 var(--space-3); padding: var(--space-4) var(--space-5); color: var(--color-text-muted); font-size: 16px; font-weight: 700; }

/* ---- existing Move menu ---- */
.export-menu { position: absolute; z-index: 2; min-width: 11rem; padding: var(--space-3); background: var(--color-bg-raised); border-radius: var(--radius-2); box-shadow: 0 4px 24px hsl(240 10% 4% / .9); }
.move-menu-item { display: flex; align-items: center; justify-content: space-between; gap: var(--space-6); padding: var(--space-3) var(--space-5); padding-left: calc(var(--space-5) + var(--depth, 0) * 14px); border-radius: var(--radius-1); color: var(--neutral-50); font-size: 18px; font-weight: 500; white-space: nowrap; }
.move-menu-item.hover { background: var(--neutral-700); }
.move-menu-item.current { color: var(--primary-300); }
.move-menu-item kbd { font: inherit; font-size: 12px; color: var(--color-text-muted); }
.menu-sep { height: 1px; margin: var(--space-3) var(--space-2); background: var(--neutral-700); }
.new-item { color: var(--primary-300); }

/* ---- NEW: place mode ---- */

.placing .draft-item, .placing .folder-item:not(.lifted), .placing .folder-add { opacity: .4; }
.placing .folder-item.sibling { opacity: 1; }
.folder-item.lifted { background: var(--color-bg-raised); box-shadow: 0 0 0 1px var(--color-accent); }
.folder-item.lifted .folder-name::after { content: ""; font-weight: 400; color: var(--primary-300); font-size: var(--font-size-1); }

.slot { position: relative; height: 16px; margin: 0 var(--space-3); cursor: pointer; flex: none; }
.slot::before { content: ""; position: absolute; left: var(--space-5); right: var(--space-5); top: 50%; height: 2px; margin-top: -1px; border-radius: 1px; background: hsla(217,91%,60%,.38); }
.slot::after { content: ""; position: absolute; left: var(--space-5); top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: hsla(217,91%,60%,.6); }
.slot.hover::before { background: var(--primary-300); height: 3px; margin-top: -1.5px; }
.slot.hover::after { background: var(--primary-300); }
.folder-children .slot { margin-left: 0; }

.flash { animation: none; background: hsla(142,71%,45%,.18); box-shadow: 0 0 0 1px hsl(142,60%,45%); }

</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-chev" viewBox="0 0 12 12"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M 2.5 4.5 L 6 8 L 9.5 4.5"/></symbol>
</svg>

<h1>Reorder folders</h1>


<div class="grid">

<!-- ============ 1: ENTRY ============ -->
<figure>
  <figcaption><span class="step">1</span><b>Move menu</b></figcaption>
  <div class="app">
    <div class="pane"><div class="pane-header"><span class="brand">kindred</span></div><div class="editor-ph">Paste or type text here…</div></div>
    <div class="pane">
      <div class="pane-header"><span class="pane-title">Drafts</span></div>
      <div class="mode-row"><div class="tabs"><span class="tab">Recents</span><span class="tab active">Folders</span></div></div>
      <div class="draft-list">

        <div class="export-menu" style="top:70px; right:56px;" role="menu">
          <div class="move-menu-item hover new-item">Reorder</div>
          <div class="menu-sep"></div>
          <div class="move-menu-item current">Top level</div>
          <div class="move-menu-item" style="--depth:0">Job search</div>
          <div class="move-menu-item" style="--depth:0">Work</div>
          <div class="move-menu-item" style="--depth:0">Personal</div>
        </div>
      </div>
    </div>
  </div>
</figure>

<!-- ============ 2: PLACE MODE, TOP LEVEL ============ -->
<figure>
  <figcaption><span class="step">2</span><b>Place mode</b></figcaption>
  <div class="app">
    <div class="pane"><div class="pane-header"><span class="brand">kindred</span></div><div class="editor-ph">Paste or type text here…</div></div>
    <div class="pane">
      <div class="pane-header"><span class="pane-title">Drafts</span></div>
      <div class="mode-row"><div class="tabs"><span class="tab">Recents</span><span class="tab active">Folders</span></div></div>
      <div class="draft-list placing">
        <div class="slot hover"></div>
        <div class="folder-item sibling open"><svg class="folder-chevron"><use href="#i-chev"/></svg><span class="folder-name">Job search</span></div>
        <div class="folder-children">
          <div class="draft-item"><div class="draft-item-body"><span class="draft-item-title">Cover letter — Acme</span></div></div>
        </div>
        <div class="folder-item lifted"><svg class="folder-chevron"><use href="#i-chev"/></svg><span class="folder-name">School</span></div>
        <div class="folder-item sibling"><svg class="folder-chevron"><use href="#i-chev"/></svg><span class="folder-name">Work</span></div>
        <div class="slot"></div>
        <div class="folder-item sibling"><svg class="folder-chevron"><use href="#i-chev"/></svg><span class="folder-name">Personal</span></div>
        <div class="slot"></div>
      </div>
    </div>
  </div>
</figure>

<!-- ============ 3: PLACE MODE, NESTED ============ -->
<figure>
  <figcaption><span class="step">3</span><b>Inside a folder</b></figcaption>
  <div class="app">
    <div class="pane"><div class="pane-header"><span class="brand">kindred</span></div><div class="editor-ph">Paste or type text here…</div></div>
    <div class="pane">
      <div class="pane-header"><span class="pane-title">Drafts</span></div>
      <div class="mode-row"><div class="tabs"><span class="tab">Recents</span><span class="tab active">Folders</span></div></div>
      <div class="draft-list placing">
        <div class="folder-item open"><svg class="folder-chevron"><use href="#i-chev"/></svg><span class="folder-name">Job search</span></div>
        <div class="folder-item open"><svg class="folder-chevron"><use href="#i-chev"/></svg><span class="folder-name">School</span></div>
        <div class="folder-children">
          <div class="slot hover"></div>
          <div class="folder-item sibling"><svg class="folder-chevron"><use href="#i-chev"/></svg><span class="folder-name">Math</span></div>
          <div class="folder-item lifted"><svg class="folder-chevron"><use href="#i-chev"/></svg><span class="folder-name">Physics</span></div>
          <div class="folder-item sibling"><svg class="folder-chevron"><use href="#i-chev"/></svg><span class="folder-name">Essays</span></div>
          <div class="slot"></div>
          <div class="draft-item"><div class="draft-item-body"><span class="draft-item-title">Thesis outline</span></div></div>
        </div>
        <div class="folder-item"><svg class="folder-chevron"><use href="#i-chev"/></svg><span class="folder-name">Work</span></div>
      </div>
    </div>
  </div>
</figure>

<!-- ============ 4: RESULT ============ -->
<figure>
  <figcaption><span class="step">4</span><b>Placed</b></figcaption>

    <div class="pane"><div class="pane-header"><span class="brand">kindred</span></div><div class="editor-ph">Paste or type text here…</div></div>
    <div class="pane">
      <div class="pane-header"><span class="pane-title">Drafts</span></div>

        <div class="folder-item open"><svg class="folder-chevron"><use href="#i-chev"/></svg><span class="folder-name">Job search</span></div>

          <div class="draft-item"><div class="draft-item-body"><span class="draft-item-title">Cover letter — Acme</span></div></div>

        <div class="folder-item"><svg class="folder-chevron"><use href="#i-chev"/></svg><span class="folder-name">Personal</span></div>
        <div class="folder-add">New Folder</div>
      </div>
    </div>
  </div>
</figure>

</div>
