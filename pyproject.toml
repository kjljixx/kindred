[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kindred"
version = "0.1.0"
description = "Local GUI and CLI for reviewing writing quality with LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "litellm>=1.50.0",
  "traceloop-sdk>=0.40.0",
  "typer>=0.12.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]

[project.scripts]
kindred = "kindred.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kindred"]

[tool.hatch.build.targets.wheel.force-include]
"src/kindred/static/dist" = "kindred/static/dist"
