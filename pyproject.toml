[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kindred"
version = "0.2.0"
description = "Local writing GUI with draft-scoped AI chat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "litellm>=1.50.0",
  "traceloop-sdk>=0.40.0",
  "typer>=0.12.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "selenium>=4.15",
]

[project.scripts]
kindred = "kindred.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/kindred"]

[tool.hatch.build.targets.wheel.force-include]
"src/kindred/static/dist" = "kindred/static/dist"
