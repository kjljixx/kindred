[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kindred"
version = "1.0.0"
description = "Fast web document editor with Git versioning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "litellm>=1.50.0",
  "traceloop-sdk>=0.40.0",
  "typer>=0.12.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.115.0",
  "cryptography>=43.0.0",
  "httpx>=0.27.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "selenium>=4.15",
]

[project.scripts]
kindred = "kindred.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
  "google_docs: tests that mutate the shared Google Docs pull fixture",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kindred"]

[tool.hatch.build.targets.wheel.force-include]
"src/kindred/static/dist" = "kindred/static/dist"
